<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  {% include nav.html %}
  <main id="main">
    <section class="section section--paper">
      <div class="wrap narrow">
        <p class="eyebrow">{{ page.piece_type | default: "Writing" }} &middot; {{ page.date | date: "%B %-d, %Y" }}</p>
        <h1>{{ page.title }}</h1>
        {% if page.excerpt_note %}<p class="tagline" style="text-align:left; color: var(--text-on-surface-dim); font-style: italic;">{{ page.excerpt_note }}</p>{% endif %}
        <div class="piece-body">
          {{ content }}
        </div>
        <hr class="tear tear--paper" style="margin: 40px 0;">
        <p><a href="{{ '/writing/' | relative_url }}">&larr; Back to all writing</a></p>
      </div>
    </section>
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
