<!--
  Fonts for all six built-in themes are loaded together, so switching
  `theme_name` in _config.yml never needs a font change too:
    theatrical → Anton / Source Serif 4
    literary   → Playfair Display / Lora
    minimal    → Space Grotesk / Inter
    blush      → Fraunces / Nunito
    meadow     → DM Serif Display / Karla
    sherbet    → Fredoka / Mulish
  (IBM Plex Mono is the shared utility/label font across all of them.)
-->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@400;500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Fraunces:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700&family=DM+Serif+Display:ital@0;1&family=Karla:wght@400;500;700&family=Fredoka:wght@400;500;600;700&family=Mulish:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
