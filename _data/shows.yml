# ============================================================
# ALL SHOWS (Dealbreaker AND storytelling) live in this one file.
#
# To add a show: copy any block below, paste it, and change the details.
# The order doesn't matter; the site sorts by date for you.
# Once a show's date passes, it moves to "Past" (or drops off the
# storytelling list) on its own. You never have to move it by hand.
#
#   date:      YYYY-MM-DD, in quotes. For a multi-day run, use the LAST day.
#   label:     optional. How the date should read on the card
#              (e.g. "Feb 14 & 15, 2026"). Leave it out to use the date.
#   time:      optional, e.g. "7:00 PM" or "Time TBD"
#   type:      dealbreaker  or  storytelling
#   title:     name of the show or event
#   venue:     optional
#   link:      optional. Tickets or info page
#   link_text: optional. Button wording (defaults to "Tickets")
#   note:      optional. Short line, e.g. "Tickets coming soon"
#   badge:     optional. Stamp on the card, e.g. "Sold Out"
# ============================================================

