blurb: "Michael’s dating advice show has been canceled! Oh no! And with his final episode, he’d like to do one “simple” thing. Define love. Over the course of this 60 minute show, Michael and the audience will form a polycule and figure out how to define the undefinable word and maybe find some solace in what to do when it ends (or answer if it can end at all??)."
